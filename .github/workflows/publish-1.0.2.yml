name: Publish Evolve in Battle 1.0.2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-1.0.2.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore final 1.0.2 source
        run: |
          echo "ee6b6def26ed5b3064d67cc3e94e3fda5161892fa06cf227fee13033a9588124  release-1.0.2.part0" | sha256sum -c -
          echo "4477fd0a730d316d67b94e97931a229b8fc8c74b79cdfeaeccb9e65566f6e543  release-1.0.2.part1" | sha256sum -c -
          echo "ac4b0dd2f8813e5fe2a8dc1b155bd73324ef4c64bec835c60fbfa8951575da2b  release-1.0.2.part2" | sha256sum -c -
          echo "6ce46217ff274160e6fd2b58dadd25debd0ee19b0e402c33e4b9c5df991fe5f7  release-1.0.2.part3" | sha256sum -c -
          cat release-1.0.2.part0 release-1.0.2.part1 release-1.0.2.part2 release-1.0.2.part3 > /tmp/eib-source.b64
          base64 -d /tmp/eib-source.b64 > /tmp/eib-source.tar.gz
          echo "61f85412a9b809209fc992df72d95c53b90cf513c0df8c301454259dcd1a3ef5  /tmp/eib-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/eib-source.tar.gz
          grep '"version": "1.0.2"' manifest.json
          grep '"experimental": false' manifest.json
          if grep -n 'Music.setVolumeLevel' main.lua; then
            echo "Unexpected battle-music volume adjustment found"
            exit 1
          fi

      - name: Run smoke tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-binaries
          texlua tests/smoke.lua
          texlua tests/smoke_exp_share.lua

      - name: Build and commit 1.0.2
        id: build
        run: |
          rm -f evolve_in_battle-v1.0.2.zip
          zip -qr evolve_in_battle-v1.0.2.zip main.lua manifest.json README.md CHANGELOG.md DIFFERENCES.md tests
          unzip -t evolve_in_battle-v1.0.2.zip
          SHA256="$(sha256sum evolve_in_battle-v1.0.2.zip | awk '{print $1}')"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- main.lua manifest.json README.md CHANGELOG.md DIFFERENCES.md tests evolve_in_battle-v1.0.2.zip
          git commit -m "Release 1.0.2"
          git push origin HEAD:main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release 1.0.2
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.build.outputs.commit }}
        run: |
          gh release create "1.0.2" \
            "evolve_in_battle-v1.0.2.zip#Evolve in Battle v1.0.2" \
            --target "$RELEASE_SHA" \
            --title "1.0.2" \
            --notes $'Audio update:\n- Battle/victory music now continues seamlessly through in-battle evolutions.\n- EVOLUTION MUSIC defaults to OFF: only the battle/victory track continues.\n- When EVOLUTION MUSIC is ON, the evolution theme plays simultaneously at normal volume with no ducking.\n- Existing Stone, Rare Candy, level-up, bench and EXP Share Modes evolution behavior is unchanged.'

      - name: Report asset SHA-256
        run: echo "evolve_in_battle-v1.0.2.zip SHA-256 = ${{ steps.build.outputs.sha256 }}"
