name: Publish Evolve in Battle 1.0.2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-1.0.2.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source baseline
        run: |
          test "$(git hash-object main.lua)" = "d39f384964e30fbe647ead56ac01ffea7200a165"
          test "$(git hash-object manifest.json)" = "679c9dfeb3ff1ee0e288c00e95e548922f9e8786"

      - name: Apply 1.0.2 release patch
        run: |
          base64 -d release-1.0.2.patch.gz.b64 | gunzip > /tmp/eib.patch
          test "$(sha256sum /tmp/eib.patch | awk '{print $1}')" = "b77faeb39a4ba6082dfacb5ef4d9e0ed9b20324920dc4a4795276e58131b997e"
          git apply --check /tmp/eib.patch
          git apply /tmp/eib.patch

      - name: Run smoke tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          lua5.4 tests/smoke.lua
          lua5.4 tests/smoke_exp_share.lua

      - name: Build stable ZIP and commit source
        id: build
        run: |
          rm -f .github/workflows/publish-1.0.2.yml release-1.0.2.patch.gz.b64
          zip -qr evolve_in_battle-v1.0.2.zip main.lua manifest.json README.md CHANGELOG.md DIFFERENCES.md tests
          unzip -t evolve_in_battle-v1.0.2.zip
          SHA256="$(sha256sum evolve_in_battle-v1.0.2.zip | awk '{print $1}')"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- main.lua manifest.json README.md CHANGELOG.md DIFFERENCES.md tests evolve_in_battle-v1.0.2.zip .github/workflows/publish-1.0.2.yml release-1.0.2.patch.gz.b64
          git commit -m "Release 1.0.2"
          git push origin HEAD:main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release 1.0.2
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.build.outputs.commit }}
        run: |
          gh release create "1.0.2" \
            "evolve_in_battle-v1.0.2.zip#Evolve in Battle v1.0.2" \
            --target "$RELEASE_SHA" \
            --title "1.0.2" \
            --notes $'Audio update:\n- Battle/victory music now continues seamlessly through in-battle evolutions.\n- EVOLUTION MUSIC defaults to OFF: only the battle/victory track continues.\n- When EVOLUTION MUSIC is ON, the evolution theme plays simultaneously at normal volume with no ducking.\n- Existing Stone, Rare Candy, level-up, bench and EXP Share Modes evolution behavior is unchanged.'

      - name: Report asset SHA-256
        run: echo "evolve_in_battle-v1.0.2.zip SHA-256 = ${{ steps.build.outputs.sha256 }}"
